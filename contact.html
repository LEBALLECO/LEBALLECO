<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="assets/images/logo_official.png">
    <title>LEBALLECO | Premium Streetwear</title>
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- Styles moved to css/index.css -->
</head>

<body>

    <header class="sticky">
        <div class="container">
            <nav>
                <a href="index.html" class="logo">
                    <img src="assets/images/header_logo.jpg" alt="LEBALLECO Logo">
                </a>
                <ul class="nav-links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="about.html">About Us</a></li>
                    <li><a href="services.html">Services</a></li>
                    <li><a href="portfolio.html">Portfolio</a></li>
                    <li><a href="blog.html">Blog</a></li>
                    <li><a href="contact.html">Contact</a></li>
                </ul>
                <a href="contact.html" class="cta-button">Get a Quote</a>
            </nav>
        </div>
    </header>

    <main style="padding-top: 80px;">
        <section class="page-hero" style="position: relative; padding: 100px 0 60px;">
            <div class="container">
                <h1 style="font-size: 3.5rem; margin-bottom: 20px;">Contact Us</h1>
                <p style="font-size: 1.25rem; color: var(--text-secondary);">We'd love to hear from you.</p>
            </div>
        </section>

        <!-- Main Contact Section with Pattern & Boxed Content -->
        <section class="bg-pattern" style="padding: 80px 0;">
            <div class="container"
                style="background: var(--bg-white); padding: 50px; border-radius: 20px; box-shadow: var(--shadow-lg); border: 1px solid var(--border-light);">
                <div class="contact-grid">
                    <div class="contact-form">
                        <form id="contactForm">
                            <div class="form-group">
                                <label for="name">Name</label>
                                <input type="text" id="name" placeholder="Your full name" required>
                            </div>
                            <div class="form-group">
                                <label for="email">Email Address</label>
                                <input type="email" id="email" placeholder="Your email address" required>
                            </div>
                            <div class="form-group">
                                <label for="service">Service Needed</label>
                                <select id="service">
                                    <option value="web-design">Web Design</option>
                                    <option value="branding">Branding</option>
                                    <option value="maintenance">Maintenance</option>
                                    <option value="other">Other</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="message">Your Message</label>
                                <textarea id="message" placeholder="Tell us about your project goals"></textarea>
                            </div>
                            <button type="submit" class="cta-button"
                                style="width: 100%; border: none; cursor: pointer;">Send Message</button>
                        </form>
                    </div>
                    <div class="contact-details">
                        <h2 style="margin-bottom: 30px;">Contact Information</h2>
                        <div class="contact-info-item">
                            <i class="fas fa-envelope"></i>
                            <div>
                                <h4>Email Us</h4>
                                <p>hello@leballeco.com</p>
                            </div>
                        </div>
                        <div class="contact-info-item">
                            <i class="fas fa-phone"></i>
                            <div>
                                <h4>Call Us</h4>
                                <p>+65 8888 9999</p>
                            </div>
                        </div>
                        <div class="contact-info-item">
                            <i class="fas fa-map-marker-alt"></i>
                            <div>
                                <h4>Visit Us</h4>
                                <p>123 Design Avenue, Singapore 012345</p>
                            </div>
                        </div>
                        <h3 style="margin-top: 50px; margin-bottom: 20px;">Follow Us</h3>
                        <div style="display: flex; gap: 20px; font-size: 2rem;">
                            <a href="https://www.instagram.com/leballeco/" target="_blank"
                                style="color: var(--primary-color);"><i class="fab fa-instagram"></i></a>
                            <a href="https://www.linkedin.com/company/leballeco/" target="_blank"
                                style="color: var(--primary-color);"><i class="fab fa-linkedin"></i></a>
                            <a href="https://www.facebook.com/leballeco/" target="_blank"
                                style="color: var(--primary-color);"><i class="fab fa-facebook"></i></a>
                            <a href="https://in.pinterest.com/leballeco/" target="_blank"
                                style="color: var(--primary-color);"><i class="fab fa-pinterest"></i></a>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- Footer same as index.html -->
    <footer>
        <div class="container">
            <div class="footer-bottom" style="opacity: 0.5; text-align: center; padding-top: 40px;">
                &copy; 2026 LEBALLECO.
            </div>
        </div>
    </footer>

    <script src="js/main.js"></script>
</body>

</html>
